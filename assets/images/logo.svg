<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C887" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9B7830" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1C2E" />
      <stop offset="100%" stop-color="#4D0E1B" />
    </linearGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(12, 10)">
    <!-- Outer Shield / Diamond -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#royalGlow)" />
    
    <!-- Royal Crown Emblem -->
    <path d="M 12 32 L 15 20 L 21 26 L 24 16 L 27 26 L 33 20 L 36 32 Z" fill="url(#goldGrad)" />
    <circle cx="15" cy="18" r="1.8" fill="#FFFDF9" />
    <circle cx="24" cy="14" r="2.2" fill="#FFFDF9" />
    <circle cx="33" cy="18" r="1.8" fill="#FFFDF9" />
    <rect x="13" y="33.5" width="22" height="2" rx="1" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="72" y="38" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">BHAKTI <tspan fill="url(#goldGrad)">EVENTS</tspan></text>
  <text x="73.5" y="53" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#C5A059" letter-spacing="2.2">ROYAL WEDDINGS &amp; CELEBRATIONS &bull; EST. 2014</text>
</svg>
